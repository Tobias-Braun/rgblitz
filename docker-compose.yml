services:
  backend:
    image: ghcr.io/tobias-braun/rgblitz-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      FEEDBACK_NOTIFY_EMAIL: ${FEEDBACK_NOTIFY_EMAIL:-}
    volumes:
      - backend_data:/app/data
      - backend_cache:/app/cache/images
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - com.centurylinklabs.watchtower.enable=true

  frontend:
    image: ghcr.io/tobias-braun/rgblitz-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
    depends_on:
      - backend
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    image: ghcr.io/tobias-braun/rgblitz-caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./certs/origin-cert.pem:/etc/caddy/origin-cert.pem:ro
      - ./certs/origin-key.pem:/etc/caddy/origin-key.pem:ro
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      - backend
      - frontend
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_FILE}:/config.json:ro
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 300

volumes:
  backend_data:
  backend_cache:
  caddy_data:
  caddy_config:
